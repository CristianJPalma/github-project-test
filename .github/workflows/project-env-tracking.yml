name: Project env tracking

on:
  pull_request:
    types: [opened, reopened]

permissions:
  contents: read

jobs:
  update-project:
    runs-on: ubuntu-latest

    steps:
      - name: Update HU status
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}

          script: |
            const PROJECT_ID = 'PVT_kwHOCkkGd84Az9vm';
            const STATUS_FIELD = 'PVTSSF_lAHOCkkGd84Az9vmzgpq9ys';
            const STATUS_IN_REVIEW = '61d25113';

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pr = context.payload.pull_request;
            const base = pr.base.ref;

            core.info(`PR #${pr.number}`);
            core.info(`Repository: ${owner}/${repo}`);
            core.info(`Base branch: ${base}`);
            core.info(`Action: ${context.payload.action}`);

            if (!['dev', 'qa', 'main'].includes(base)) {
              core.info(`La rama '${base}' no está contemplada.`);
              return;
            }

            // Buscar una referencia del tipo:
            // github-project-test#5
            const text = `${pr.title}\n${pr.body || ''}`;
            const regex = new RegExp(`${repo}#(\\d+)`, 'g');

            const issueNumbers = new Set();
            let match;

            while ((match = regex.exec(text)) !== null) {
              issueNumbers.add(parseInt(match[1], 10));
            }

            if (!issueNumbers.size) {
              core.warning(
                `No se encontró una referencia ${repo}#N en el PR.`
              );
              return;
            }

            const updateField = async (itemId, fieldId, optionId) => {
              await github.graphql(
                `
                mutation(
                  $projectId: ID!,
                  $itemId: ID!,
                  $fieldId: ID!,
                  $optionId: String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: {
                        singleSelectOptionId: $optionId
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
                `,
                {
                  projectId: PROJECT_ID,
                  itemId,
                  fieldId,
                  optionId
                }
              );
            };

            for (const issueNumber of issueNumbers) {
              const result = await github.graphql(
                `
                query(
                  $owner: String!,
                  $repo: String!,
                  $number: Int!
                ) {
                  repository(owner: $owner, name: $repo) {
                    issue(number: $number) {
                      id
                      projectItems(first: 50) {
                        nodes {
                          id
                          project {
                            id
                          }
                        }
                      }
                    }
                  }
                }
                `,
                {
                  owner,
                  repo,
                  number: issueNumber
                }
              );

              const issue = result.repository.issue;

              if (!issue) {
                core.warning(
                  `Issue #${issueNumber} no existe.`
                );
                continue;
              }

              const item = issue.projectItems.nodes.find(
                item => item.project.id === PROJECT_ID
              );

              if (!item) {
                core.warning(
                  `Issue #${issueNumber} no está en el Project.`
                );
                continue;
              }

              await updateField(
                item.id,
                STATUS_FIELD,
                STATUS_IN_REVIEW
              );

              core.info(
                `Issue #${issueNumber}: Status = In Review`
              );
            }
