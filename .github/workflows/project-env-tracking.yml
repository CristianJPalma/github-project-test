name: Project env tracking

on:
  pull_request:
    types: [opened, reopened, closed]
    branches: [dev, qa, main]

permissions:
  contents: read

jobs:
  update-project:
    # Ejecutar cuando:
    # - el PR se abre
    # - el PR se reabre
    # - el PR se cierra después de un merge
    if: |
      github.event.action == 'opened' ||
      github.event.action == 'reopened' ||
      (
        github.event.action == 'closed' &&
        github.event.pull_request.merged == true
      )

    runs-on: ubuntu-latest

    steps:
      - name: Update HU status and environment
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.PROJECT_TOKEN }}

          script: |
            const PROJECT_ID = 'PVT_kwHOCkkGd84Az9vm';

            // ---------------------------------------------------------
            // Project fields
            // ---------------------------------------------------------

            const STATUS_FIELD =
              'PVTSSF_lAHOCkkGd84Az9vmzgpq9ys';

            const ENVIRONMENT_FIELD =
              'PVTSSF_lAHOCkkGd84Az9vmzhaaI9k';

            // ---------------------------------------------------------
            // Status options
            // ---------------------------------------------------------

            const STATUS_IN_REVIEW = '61d25113';
            const STATUS_IN_PROGRESS = '47fc9ee4';
            const STATUS_DONE = '98236657';

            // ---------------------------------------------------------
            // Environment options
            // ---------------------------------------------------------

            const ENV_DEV = '90d0f115';
            const ENV_QA = 'ffaf1160';
            const ENV_PRODUCTION = '9266a477';

            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const pr = context.payload.pull_request;

            const base = pr.base.ref;
            const action = context.payload.action;
            const merged = pr.merged === true;

            core.info(`PR #${pr.number}`);
            core.info(`Repository: ${owner}/${repo}`);
            core.info(`Base branch: ${base}`);
            core.info(`Action: ${action}`);
            core.info(`Merged: ${merged}`);

            // ---------------------------------------------------------
            // Determinar Status y Environment
            //
            // PR abierto/reabierto:
            //
            //   -> In Review
            //   -> Environment = ambiente del PR
            //
            // PR mergeado a dev:
            //
            //   -> In Progress
            //   -> Environment = QA
            //
            // PR mergeado a qa:
            //
            //   -> In Progress
            //   -> Environment = Production
            //
            // PR mergeado a main:
            //
            //   -> Done
            //   -> Environment = Production
            // ---------------------------------------------------------

            let statusOption;
            let statusName;
            let environmentOption;
            let environmentName;

            if (action === 'opened' || action === 'reopened') {

              statusOption = STATUS_IN_REVIEW;
              statusName = 'In Review';

              switch (base) {

                case 'dev':
                  environmentOption = ENV_DEV;
                  environmentName = 'Dev';
                  break;

                case 'qa':
                  environmentOption = ENV_QA;
                  environmentName = 'QA';
                  break;

                case 'main':
                  environmentOption = ENV_PRODUCTION;
                  environmentName = 'Production';
                  break;

                default:
                  core.info(
                    `La rama '${base}' no está contemplada.`
                  );
                  return;
              }

            } else if (action === 'closed' && merged) {

              switch (base) {

                case 'dev':
                  // Dev ya terminó.
                  // La siguiente etapa es QA.
                  statusOption = STATUS_IN_PROGRESS;
                  statusName = 'In Progress';

                  environmentOption = ENV_QA;
                  environmentName = 'QA';
                  break;

                case 'qa':
                  // QA ya terminó.
                  // La siguiente etapa es Production.
                  statusOption = STATUS_IN_PROGRESS;
                  statusName = 'In Progress';

                  environmentOption = ENV_PRODUCTION;
                  environmentName = 'Production';
                  break;

                case 'main':
                  // La HU llegó a producción.
                  statusOption = STATUS_DONE;
                  statusName = 'Done';

                  environmentOption = ENV_PRODUCTION;
                  environmentName = 'Production';
                  break;

                default:
                  core.info(
                    `No existe regla de merge para '${base}'.`
                  );
                  return;
              }

            } else {

              core.info(
                'Evento no requiere actualización.'
              );
              return;
            }

            core.info(
              `Status seleccionado: ${statusName}`
            );

            core.info(
              `Environment seleccionado: ${environmentName}`
            );

            // ---------------------------------------------------------
            // Buscar Issue/HU referenciada en el PR
            //
            // Formato esperado:
            //
            // github-project-test#11
            // ---------------------------------------------------------

            const text = `${pr.title}\n${pr.body || ''}`;

            const regex =
              new RegExp(`${repo}#(\\d+)`, 'g');

            const issueNumbers = new Set();

            let match;

            while ((match = regex.exec(text)) !== null) {

              issueNumbers.add(
                parseInt(match[1], 10)
              );
            }

            if (!issueNumbers.size) {

              core.warning(
                `No se encontró una referencia ${repo}#N en el PR.`
              );

              return;
            }

            // ---------------------------------------------------------
            // Función para actualizar un campo Single Select
            // ---------------------------------------------------------

            const updateField = async (
              itemId,
              fieldId,
              optionId
            ) => {

              await github.graphql(
                `
                mutation(
                  $projectId: ID!,
                  $itemId: ID!,
                  $fieldId: ID!,
                  $optionId: String!
                ) {
                  updateProjectV2ItemFieldValue(
                    input: {
                      projectId: $projectId
                      itemId: $itemId
                      fieldId: $fieldId
                      value: {
                        singleSelectOptionId: $optionId
                      }
                    }
                  ) {
                    projectV2Item {
                      id
                    }
                  }
                }
                `,
                {
                  projectId: PROJECT_ID,
                  itemId,
                  fieldId,
                  optionId
                }
              );
            };

            // ---------------------------------------------------------
            // Procesar cada Issue encontrada
            // ---------------------------------------------------------

            for (const issueNumber of issueNumbers) {

              try {

                const result =
                  await github.graphql(
                    `
                    query(
                      $owner: String!,
                      $repo: String!,
                      $number: Int!
                    ) {
                      repository(
                        owner: $owner,
                        name: $repo
                      ) {
                        issue(number: $number) {
                          id

                          projectItems(first: 50) {
                            nodes {
                              id

                              project {
                                id
                              }
                            }
                          }
                        }
                      }
                    }
                    `,
                    {
                      owner,
                      repo,
                      number: issueNumber
                    }
                  );

                const issue =
                  result.repository.issue;

                if (!issue) {

                  core.warning(
                    `Issue #${issueNumber} no existe.`
                  );

                  continue;
                }

                // -------------------------------------------------------
                // Buscar la tarjeta de esa Issue dentro del Project
                // -------------------------------------------------------

                const item =
                  issue.projectItems.nodes.find(
                    item =>
                      item.project.id === PROJECT_ID
                  );

                if (!item) {

                  core.warning(
                    `Issue #${issueNumber} no está en el Project.`
                  );

                  continue;
                }

                core.info(
                  `Issue #${issueNumber} encontrada en el Project.`
                );

                core.info(
                  `Project Item ID: ${item.id}`
                );

                // -------------------------------------------------------
                // Actualizar Status
                // -------------------------------------------------------

                await updateField(
                  item.id,
                  STATUS_FIELD,
                  statusOption
                );

                core.info(
                  `Issue #${issueNumber}: Status = ${statusName}`
                );

                // -------------------------------------------------------
                // Actualizar Environment
                // -------------------------------------------------------

                await updateField(
                  item.id,
                  ENVIRONMENT_FIELD,
                  environmentOption
                );

                core.info(
                  `Issue #${issueNumber}: Environment = ${environmentName}`
                );

              } catch (error) {

                core.warning(
                  `Issue #${issueNumber}: ${error.message}`
                );
              }
            }